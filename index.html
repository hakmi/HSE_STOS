<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Évaluation d'Habilitation HT/THT - STOS Sonelgaz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap'); 
        
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .font-arabic { font-family: 'Tajawal', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .radio-custom:checked + label { background-color: #eff6ff; border-color: #0072ce; box-shadow: 0 4px 6px -1px rgba(0, 114, 206, 0.1); }
        .radio-custom:checked + label .radio-circle { border-color: #0072ce; background-color: #0072ce; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px;}
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .bg-sonelgaz-blue { background-color: #0072ce; }
        .text-sonelgaz-blue { color: #0072ce; }
        .border-sonelgaz-blue { border-color: #0072ce; }
        .bg-sonelgaz-orange { background-color: #f39200; }
        .text-sonelgaz-orange { color: #f39200; }
        .border-sonelgaz-orange { border-color: #f39200; }
        
        .tab-active { border-bottom: 3px solid #0072ce; color: #0072ce; font-weight: 700; }
        .tab-inactive { border-bottom: 3px solid transparent; color: #64748b; font-weight: 500; }

        .ai-report h3 { color: #0072ce; font-size: 1.25rem; font-weight: 800; margin-top: 1.5rem; margin-bottom: 0.75rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
        .ai-report p { margin-bottom: 1rem; line-height: 1.6; }
        .ai-report ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .ai-report li { margin-bottom: 0.5rem; }
        .ai-report strong { color: #1e293b; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col selection:bg-sonelgaz-orange selection:text-white relative">

    <!-- CHRONOMÈTRE GLOBAL -->
    <div id="global-timer" class="hidden fixed top-2 right-2 sm:top-5 sm:right-5 z-50 bg-red-600 text-white font-mono font-bold text-lg sm:text-2xl px-4 sm:px-6 py-2 sm:py-3 rounded-xl shadow-2xl border-4 border-white flex items-center gap-3">
        <i class="fas fa-stopwatch animate-pulse"></i>
        <span id="timer-display">01:00:00</span>
    </div>

    <header class="bg-white border-b-4 border-sonelgaz-blue shadow-sm py-3 px-4 sm:px-6 flex justify-between items-center sticky top-0 z-30">
        <div class="flex items-center gap-3 sm:gap-5">
            <div id="logo-container" class="relative shrink-0 flex items-center justify-center bg-white rounded-lg shadow-sm border border-slate-100 h-12 w-12 sm:h-16 sm:w-16 overflow-hidden">
                <img src="logo.png" alt="Sonelgaz Logo" class="w-full h-full object-contain z-10" id="main-logo" onerror="document.getElementById('main-logo').style.display='none'; document.getElementById('svg-logo').style.display='block';">
                <svg id="svg-logo" style="display:none;" viewBox="0 0 100 100" class="w-full h-full rounded">
                    <rect width="100" height="100" fill="#f39200"/>
                    <path d="M 20 60 L 45 20 L 60 20 L 40 50 L 75 50 L 50 85 L 65 85 L 85 45 L 80 40 L 50 40 Z" fill="#0072ce"/>
                    <circle cx="60" cy="25" r="7" fill="#0072ce"/>
                    <circle cx="80" cy="25" r="7" fill="#0072ce"/>
                </svg>
            </div>
            
            <div class="flex flex-col justify-center">
                <span class="text-sonelgaz-blue font-bold text-sm sm:text-lg md:text-xl font-arabic leading-tight tracking-wide">
                    منصة تجريبية لعمال سونلغاز نقل الكهرباء و مسير المنظومة (اعداد حاكمي عبد الكريم)
                </span>
                <span class="text-sonelgaz-blue font-semibold text-[10px] sm:text-xs md:text-sm mt-0.5 leading-tight">
                    Plateforme Test d'Habilitation Sonelgaz STOS ( par M : Hakmi Abdelkrim)
                </span>
            </div>
        </div>
        
        <button onclick="window.showAdminLogin()" class="ml-4 text-slate-400 hover:text-sonelgaz-blue transition flex flex-col items-center shrink-0 p-2 rounded-xl hover:bg-slate-50 border border-transparent hover:border-slate-200">
            <i class="fas fa-lock text-lg"></i>
            <span class="text-[10px] font-bold mt-1 tracking-widest">ADMIN</span>
        </button>
    </header>

    <main id="app-container" class="flex-grow flex items-center justify-center p-4 sm:p-6 w-full max-w-6xl mx-auto">
        <!-- Contenu dynamique injecté par JavaScript -->
    </main>

    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs sm:text-sm text-gray-500 font-medium">
        &copy; 2026 - Plateforme d'Évaluation Pédagogique - STOS Sonelgaz | Données sécurisées localement
    </footer>

    <script>
        const districts = ["ORAN", "MOSTAGANEM", "SIDI BELABES", "TIARET", "MASCARA", "TLEMCEN", "AIN TEMOUCHENT"];
        // Ajout du Service "CE ESSAIS/ANALYSES"
        const services = ["Exploitation", "Contrôle électrique", "Maintenance Poste", "Maintenance Ligne (ML)", "CE ESSAIS/ANALYSES"];
        
        // -------------------------------------------------------------------------
        // 1. BASE DE DONNÉES : EXPLOITATION (Standards)
        // -------------------------------------------------------------------------
        const poolExploitation = [
            { theme: "Procédure & OT", type: "Épreuve Écrite", question: "Une équipe se présente pour une intervention urgente demandée par la hiérarchie. Le Chef de Travaux (CDT) n'a pas d'Ordre de Travail (OT) formel. Que doit faire le CC ?", options: ["Accepter l'intervention si la hiérarchie confirme.", "Rédiger lui-même l'OT.", "Refuser catégoriquement toute consignation jusqu'à présentation d'un OT valide.", "Délivrer l'AT avec mention 'OT manquant'."], correctIndex: 2, justification: "L'OT est le document juridique de base. Sans lui, l'intervention n'existe pas." },
            { theme: "Faute d'Exploitation", type: "Épreuve Écrite", question: "Suite à une surcharge, le CC décide de son propre chef d'effectuer un transfert de charge. Qualification ?", options: ["Excellente initiative.", "Manœuvre de routine.", "Une faute d'exploitation très grave.", "Un acte toléré de jour."], correctIndex: 2, justification: "Seul le Dispatching a l'autorité pour modifier la topologie du réseau." },
            { theme: "Communication", type: "Épreuve Écrite", question: "Le Dispatching ordonne l'ouverture d'une ligne. Le Chef de Poste répond : « D'accord, j'ouvre ». Quelle règle manque ?", options: ["Dire 'Terminé'.", "La règle du message collationné (répétition intégrale).", "Un fax de confirmation.", "Aucune règle."], correctIndex: 1, justification: "Le collationnement est obligatoire en HT/THT." },
            { theme: "Habilitations", type: "Épreuve Écrite", question: "Un agent 'HC' peut-il s'auto-délivrer une AT pour réparer un disjoncteur ?", options: ["Oui, HC est supérieur.", "Oui, s'il est seul.", "Non, HC et H2 ont des périmètres distincts.", "Oui avec accord sécurité."], correctIndex: 2, justification: "HC = Consignation, H2 = Travaux. Il faut obligatoirement H2." },
            { theme: "Règles d'Or", type: "Simulation", question: "Le CDT a l'AT et dit : 'On grimpe sur le pylône'. Erreur ?", options: ["Météo non vérifiée.", "Omet la VAT et la pose des MALT locales.", "Pas prévenu la direction.", "A oublié son casque."], correctIndex: 1, justification: "L'AT gère les sources lointaines, le CDT gère la VAT/MALT de chantier." },
            { theme: "Incident SF6", type: "Simulation", question: "Disjoncteur 400 kV - Alarme 'SF6 - 2ème Stade (Lockout)'. Que faire ?", options: ["Ouvrir lentement.", "Forcer manuellement.", "Isoler la travée via disjoncteurs encadrants (CBF).", "Fermer les terres."], correctIndex: 2, justification: "Le gaz n'éteint plus l'arc. Risque d'explosion." },
            { theme: "Transformateur", type: "Simulation", question: "Température huile Transfo Très Haute. Ventilateurs à l'arrêt. Action ?", options: ["Arroser à l'eau.", "Délestage immédiat pour réduire la charge.", "Régleur au minimum.", "Déclencher la ligne."], correctIndex: 1, justification: "Sans ventilation (ONAF), le transfo perd 30% de sa capacité." }
        ];

        // -------------------------------------------------------------------------
        // 2. BASE DE DONNÉES : CONTRÔLE ÉLECTRIQUE (Extraits)
        // -------------------------------------------------------------------------
        const poolControle = [
            { theme: "Relais Buchholz", type: "Épreuve Écrite", question: "Dans la protection d'un transformateur de puissance, quel est le rôle principal du relais Buchholz (ANSI 63) ?", options: ["Protéger contre les surcharges thermiques lentes.", "Détecter les défauts internes (dégagement de gaz lent ou mouvement violent d'huile).", "Régler la tension de sortie.", "Mesurer le courant de court-circuit externe."], correctIndex: 1, justification: "Le relais Buchholz détecte l'arc interne générant des gaz (Alarme) ou un afflux violent d'huile (Déclenchement)." },
            { theme: "Relais Lockout (86)", type: "Épreuve Écrite", question: "Dans un schéma de protection, quelle est la fonction du relais ANSI 86 (Lockout Relay) ?", options: ["Il réenclenche automatiquement le disjoncteur.", "Il bloque la fermeture du disjoncteur jusqu'à son réarmement manuel après un déclenchement critique.", "Il régule la température de l'huile.", "Il assure la communication SCADA."], correctIndex: 1, justification: "Le 86 empêche la remise sous tension accidentelle d'un équipement ayant subi un défaut interne (87T, 63)." },
            { theme: "Défaillance Disjoncteur (50BF)", type: "Simulation", question: "Quel est le rôle de la protection 50BF (Breaker Failure) ?", options: ["Refermer la ligne.", "Mesurer l'usure des contacts.", "Si le disjoncteur refuse de s'ouvrir sur défaut, elle déclenche tous les autres disjoncteurs du même jeu de barres.", "Signaler une perte de SF6."], correctIndex: 2, justification: "Le 50BF est la protection de secours ultime. S'il détecte un courant persistant après l'ordre d'ouverture, il isole le nœud." },
            { theme: "Zones de Distance", type: "Simulation", question: "Dans une protection de distance de ligne, quelle est la portée typique de la Zone 1 (Z1) ?", options: ["120% de la ligne, temporisée à 0.3s.", "80% à 85% de la ligne protégée, avec déclenchement instantané.", "50% de la ligne.", "200% de la ligne."], correctIndex: 1, justification: "La Z1 couvre 80% pour éviter les déclenchements intempestifs sur la barre distante (Over-reach)." }
        ];

        // -------------------------------------------------------------------------
        // 3. BASE DE DONNÉES : MAINTENANCE POSTE ET LIGNE (Extraits)
        // -------------------------------------------------------------------------
        const poolMaintenance = [
            { theme: "Rigidité Diélectrique (Huile)", type: "Simulation Pratique", question: "Lors du test de claquage de l'huile minérale d'un transformateur, quelle est la distance standardisée entre les électrodes de l'éclateur (selon IEC 156) ?", options: ["10 mm.", "2.5 mm.", "5 cm.", "Il n'y a pas d'électrodes."], correctIndex: 1, justification: "La norme IEC spécifie un écartement strict de 2.5 mm." },
            { theme: "Analyse DGA (C2H2)", type: "Épreuve Écrite", question: "L'analyse des gaz dissous (DGA) révèle une présence massive d'Acétylène (C2H2). Quel est le diagnostic direct ?", options: ["Un léger échauffement thermique du papier.", "La présence de décharges partielles mineures.", "L'existence d'arcs électriques de haute énergie (étincelles violentes) à l'intérieur de la cuve.", "L'huile est simplement trop vieille."], correctIndex: 2, justification: "La formation d'Acétylène nécessite des températures extrêmes (plusieurs milliers de degrés), caractéristiques d'un arc électrique." }
        ];
        
        const poolMaintenanceLigne = [
            { theme: "Sécurité & Comportement (Téléphone)", type: "Simulation Pratique", question: "Lors de la procédure stricte de consignation ou de la Vérification d'Absence de Tension (VAT) sur un pylône, pourquoi l'usage du smartphone personnel est-il formellement interdit ?", options: ["Parce qu'il interfère avec les ondes radio du Dispatching.", "Parce qu'une seconde d'inattention lors d'étapes critiques peut faire oublier la VAT ou provoquer une approche de la zone sous tension, menant à un arc mortel.", "Parce que le chef d'équipe l'a décidé.", "Pour économiser la batterie du téléphone."], correctIndex: 1, justification: "La distraction cognitive due au téléphone est une cause majeure d'accidents mortels." },
            { theme: "Sécurité en Hauteur (Point Mort)", type: "Simulation Pratique", question: "Lors de l'ascension d'un pylône, qu'appelle-t-on l'erreur éliminatoire du « Point Mort » ?", options: ["Faire une pause au milieu du pylône.", "Se déconnecter totalement (aucune longe attachée) pendant quelques secondes pour franchir un obstacle, se retrouvant sans aucune sécurité antichute.", "Lâcher ses outils.", "Oublier de porter des gants isolants."], correctIndex: 1, justification: "Se retrouver à 0% connecté, même pour une fraction de seconde, est une faute gravissime." }
        ];

        // -------------------------------------------------------------------------
        // 5. NOUVELLE BASE DE DONNÉES : CE ESSAIS / ANALYSES (80+ Questions Exclusives)
        // -------------------------------------------------------------------------
        const poolEssaisAnalyses = [
            // --- THÈME 1 : ESSAIS DES TRANSFORMATEURS DE MESURE (TC & TT) ---
            { theme: "Test de Polarité (TC)", type: "Simulation Pratique", question: "Lors d'un test de polarité (Flick Test) d'un Transformateur de Courant (TC) avec une pile 9V et un galvanomètre, que doit faire l'aiguille à la FERMETURE du circuit si la polarité (P1-P2 / S1-S2) est correcte ?", options: ["Elle ne bouge pas.", "Elle dévie brusquement vers la droite (positif), puis revient à zéro.", "Elle dévie lentement vers la gauche (négatif).", "Elle oscille continuellement."], correctIndex: 1, justification: "Par la loi de Lenz, si les bornes homologues sont respectées, le courant induit crée une déviation instantanée positive à la fermeture." },
            { theme: "Saturation TC (Knee Point)", type: "Épreuve Écrite", question: "Lors de l'essai de la courbe de magnétisation (Excitation Curve) d'un TC, comment définit-on le point de coude (Knee Point) selon la norme IEC ?", options: ["Le point où la tension maximale est atteinte.", "Le point où une augmentation de 10% de la tension d'excitation entraîne une augmentation de 50% du courant magnétisant.", "Le point où le courant secondaire devient nul.", "Le point de rupture de l'isolant."], correctIndex: 1, justification: "Au-delà de ce point, le noyau magnétique sature fortement et le TC ne garantit plus la précision de son rapport de transformation." },
            { theme: "Classes de TC (5P20)", type: "Épreuve Écrite", question: "Suite à l'analyse d'un TC, sa plaque indique '5P20'. Qu'est-ce que cela signifie en termes de Commissioning ?", options: ["Puissance de 5 VA et tension de 20 kV.", "Précision de classe 5 pour les mesures, jusqu'à 20 Ampères.", "C'est un TC de Protection (P) avec une erreur composite maximale de 5% lorsque le courant primaire atteint 20 fois le courant nominal (In).", "TC à 5 noyaux."], correctIndex: 2, justification: "Le '5' est le pourcentage d'erreur, 'P' indique Protection, et '20' est le facteur limite de précision (ALF) avant saturation." },
            { theme: "Danger TC Ouvert", type: "Simulation Pratique", question: "Pendant les essais d'injection primaire, vous constatez que le circuit secondaire d'un TC en service a été laissé OUVERT (Open Circuit). Quel est le risque immédiat ?", options: ["Le relais de distance déclenche.", "Le noyau sature instantanément, générant des pics de tension de plusieurs kilovolts aux bornes secondaires, mortels pour l'homme et destructeurs pour l'isolant.", "Le courant primaire s'effondre à zéro.", "L'huile du TC gèle."], correctIndex: 1, justification: "Sans le flux démagnétisant du courant secondaire, le flux magnétique explose et induit une tension E = N(dΦ/dt) extrêmement élevée." },
            { theme: "Danger TT Court-Circuité", type: "Simulation Pratique", question: "Pendant les essais, si un technicien crée accidentellement un court-circuit franc aux bornes secondaires d'un Transformateur de Tension (TT) sous tension, que se passe-t-il ?", options: ["Rien, le TT est conçu pour supporter cela.", "La tension primaire augmente.", "Un courant énorme va circuler au secondaire (I = U/Z_très_faible), brûlant le bobinage et pouvant faire exploser le TT si les micro-disjoncteurs (MCB) ne déclenchent pas.", "Le relais différentiel bloque."], correctIndex: 2, justification: "Contrairement au TC, un TT est une source de tension. Le court-circuiter est une erreur critique équivalente à un court-circuit réseau." },
            { theme: "Injection Primaire (Primary Injection)", type: "Épreuve Écrite", question: "Quel est l'objectif ultime du test d'injection PRIMAIRE dans un poste neuf, par rapport à l'injection secondaire ?", options: ["Il est plus rapide à exécuter.", "Il vérifie UNIQUEMENT le relais.", "Il permet de valider l'intégrité de la CHAÎNE COMPLÈTE : Rapport du TC physique, filerie jusqu'au panneau, polarité réelle, et déclenchement effectif du disjoncteur.", "Il permet de tester la rigidité de l'huile."], correctIndex: 2, justification: "L'injection secondaire ne teste que le relais. L'injection primaire injecte un vrai courant fort dans les barres HT pour valider qu'il n'y a aucune erreur de câblage (fils croisés, TC inversé)." },
            { theme: "Mesure de Fardeau (Burden Test)", type: "Épreuve Écrite", question: "Lors du 'Burden Test' d'un TC, si la charge mesurée de la filerie + relais est de 25 VA pour un TC plaqué à 15 VA. Quelle est la conséquence en exploitation ?", options: ["Le TC sera plus précis.", "Le TC va saturer prématurément (bien avant son ALF de 20), empêchant la protection de voir le vrai courant lors d'un court-circuit.", "La tension du poste va chuter.", "Aucun impact, le relais compensera."], correctIndex: 1, justification: "Une charge (Burden) trop forte oblige le TC à générer plus de tension pour faire circuler le courant, l'amenant très vite au point de saturation (Knee point)." },
            { theme: "Types de TT (CVT)", type: "Épreuve Écrite", question: "Sur les lignes 400kV, on teste fréquemment des CVT (Capacitor Voltage Transformers). Quelle est leur particularité par rapport aux VTs inductifs classiques ?", options: ["Ils ne mesurent que le courant continu.", "Ils utilisent un diviseur capacitif pour abaisser la THT économiquement et servent également à coupler les signaux de télécommunication haute fréquence (CPL/PLC).", "Ils n'ont pas besoin de mise à la terre.", "Ils produisent de l'énergie réactive massive."], correctIndex: 1, justification: "Le CVT a un double rôle : mesure de la tension (diviseur capacitif + transfo moyenne tension) et transmission des signaux de protection (carrier) sur la ligne." },

            // --- THÈME 2 : ESSAIS DES CÂBLES HT ET LOCALISATION DE DÉFAUTS ---
            { theme: "Test de Câbles (VLF vs DC)", type: "Épreuve Écrite", question: "Pourquoi les normes modernes d'essais exigent-elles de tester les câbles synthétiques (XLPE) avec une source VLF (0.1 Hz AC) plutôt qu'avec l'ancien test HIPOT DC (Courant Continu) ?", options: ["Le VLF est plus rapide.", "Le test DC (continu) piège des charges d'espace dans le plastique XLPE, créant un stress localisé qui provoque le claquage du câble lors de la remise sous tension AC (Water treeing).", "Le VLF utilise des tensions beaucoup plus élevées.", "Le DC ne détecte pas les courts-circuits."], correctIndex: 1, justification: "L'application d'un test Hipot DC sur un câble XLPE dégrade irrémédiablement sa durée de vie à cause du phénomène de polarisation des arborescences d'eau (Treeing). Le VLF (Very Low Frequency) simule l'AC sans exiger une puissance énorme." },
            { theme: "Localisation (Réflectométrie / TDR)", type: "Épreuve Écrite", question: "Dans le labo de recherche de défauts de câbles, à quoi sert l'échomètre (TDR - Time Domain Reflectometer) ?", options: ["À brûler le défaut.", "À envoyer une impulsion électrique (pulse) basse tension dans le câble et mesurer le temps de retour de l'écho pour calculer la DISTANCE du défaut (Open ou Short circuit).", "À écouter le bruit sous la terre.", "À mesurer l'humidité du sol."], correctIndex: 1, justification: "L'échomètre (TDR) donne une pré-localisation de la distance (ex: défaut à 450 mètres) en analysant la réflexion de l'onde sur les changements d'impédance." },
            { theme: "Générateur d'Ondes de Choc (Thumper)", type: "Simulation Pratique", question: "Quel est le but de l'utilisation d'un Surge Wave Generator (Thumper / Éclateur) couplé à un géophone (écouteur de sol) ?", options: ["Nettoyer le câble des impuretés.", "Localiser avec précision (Pinpointing) le défaut en envoyant de puissantes décharges capacitives (kV) qui créent un arc bruyant (claquement) au point exact du défaut sous la terre.", "Mesurer la résistance de terre.", "Refroidir l'isolant fondu."], correctIndex: 1, justification: "Le 'Thump' est le bruit de l'explosion de l'arc sous terre. Avec un casque géophone, l'opérateur marche à la distance donnée par le TDR et écoute pour marquer le sol avant de creuser." },
            { theme: "Brûlage de Câble (Burn-down)", type: "Simulation Pratique", question: "Pourquoi utilise-t-on parfois la fonction 'Burn-down' (Brûlage) d'un équipement de test de câble avant d'utiliser l'échomètre ?", options: ["Pour chauffer la route en hiver.", "Pour réduire une résistance de défaut très élevée (High resistance fault) en un court-circuit franc (Low resistance), afin que l'échomètre (TDR) puisse voir une réflexion nette.", "Pour détruire les câbles voisins.", "Pour souder une jonction."], correctIndex: 1, justification: "Un défaut hautement résistif (ex: infiltration d'eau) ne renvoie pas d'écho clair. Le brûlage carbonise l'isolant à cet endroit précis pour créer un pont conducteur franc." },
            { theme: "Essai de Gaine (Sheath Test)", type: "Épreuve Écrite", question: "Avant la mise en service d'un câble Haute Tension, pourquoi effectue-t-on un test diélectrique (ex: 10kV DC) sur la Gaine Extérieure (Oversheath) ?", options: ["Pour tester la couleur du câble.", "Pour s'assurer que la gaine de protection en PE/PVC n'a pas été déchirée lors du tirage mécanique dans la tranchée, évitant ainsi la pénétration d'eau et la corrosion de l'écran métallique.", "Pour augmenter le courant capacitif.", "C'est un test inutile."], correctIndex: 1, justification: "Une gaine extérieure percée laisse entrer l'eau, ce qui corrode l'écran de cuivre et provoque à terme des défauts. Si le test de fuite échoue, la gaine est endommagée." },
            { theme: "Courant Capacitif (Câble)", type: "Épreuve Écrite", question: "Lors d'un test Hipot AC à fréquence industrielle (50Hz) sur un câble souterrain de 20 kilomètres, le principal problème technique rencontré est :", options: ["Le câble va rétrécir.", "Le courant capacitif (I=U.C.ω) appelé par un si long câble est gigantesque, nécessitant un équipement de test d'une puissance apparente (MVA) colossale (souvent irréalisable sur site).", "La résistance du cuivre est trop forte.", "Le câble se transforme en antenne."], correctIndex: 1, justification: "C'est pour cela qu'on utilise le VLF (0.1 Hz). En divisant la fréquence (ω) par 500, on divise la puissance nécessaire du générateur de test par 500." },

            // --- THÈME 3 : ESSAIS DES TRANSFORMATEURS DE PUISSANCE ---

            { theme: "DGA (Gaz Dissous)", type: "Épreuve Écrite", question: "Le rapport d'analyse DGA indique un fort taux d'Éthylène (C2H4) et d'Éthane (C2H6), mais pas d'Acétylène. Quel est le diagnostic de l'expert en analyses ?", options: ["Arc électrique de très forte énergie (Claquage).", "C'est normal, c'est l'odeur de l'huile.", "Un point chaud thermique sévère (Surchauffe d'une connexion ou de l'huile entre 300°C et 700°C) sans arc électrique.", "Pénétration d'eau dans la cuve."], correctIndex: 2, justification: "L'éthylène est le marqueur typique des défauts thermiques de haute température. S'il y avait un arc (électrique), l'acétylène (C2H2) serait présent." },
            { theme: "Test de Court-Circuit (Impédance)", type: "Épreuve Écrite", question: "Lors de l'essai de court-circuit (Short Circuit Test / Leakage Reactance) d'un transformateur, on court-circuite le secondaire et on augmente lentement la tension primaire. Quand s'arrête-t-on ?", options: ["Quand la tension atteint 100% de Un.", "Quand le relais Buchholz sonne.", "Dès que le courant circulant dans les enroulements atteint le courant nominal (In). La tension appliquée à ce moment est la 'Tension de court-circuit' (Ucc%).", "Quand l'huile bout."], correctIndex: 2, justification: "Ce test permet de valider le Ucc% (Impédance % / Leakage reactance) défini sur la plaque signalétique, crucial pour les calculs de court-circuit du réseau." },

            { theme: "Caractéristique Différentielle (87T)", type: "Épreuve Écrite", question: "Lors du test de la protection différentielle (87T), l'ingénieur trace la courbe 'Idiff vs Irest'. Pourquoi la courbe possède-t-elle un 'Slope' (Pente / Bias) ?", options: ["Pour des raisons esthétiques.", "Pour empêcher la protection de déclencher lors d'un gros court-circuit EXTERNE, où la saturation inégale des TC pourrait créer un faux courant différentiel.", "Pour augmenter la vitesse de calcul.", "Pour mesurer la chaleur."], correctIndex: 1, justification: "Le pourcentage de retenue (Bias/Slope) désensibilise le relais proportionnellement au courant traversant (Through current), stabilisant la protection contre les erreurs de TC." },

            { theme: "Protection Directionnelle (67)", type: "Épreuve Écrite", question: "Lors du test d'un relais directionnel (67), l'ingénieur fait varier l'angle (MTA - Maximum Torque Angle) entre la tension et le courant injectés. Pourquoi ?", options: ["Pour tester l'affichage de l'écran.", "Pour vérifier que le relais déclenche bien UNIQUEMENT lorsque le courant s'écoule dans le sens 'Avant' (Forward, vers le défaut) et se bloque dans le sens 'Arrière' (Reverse).", "Pour régler l'heure du relais.", "Pour convertir les Ampères en Volts."], correctIndex: 1, justification: "La fonction directionnelle est vitale dans les réseaux maillés pour garantir que seul le relais le plus proche du défaut (voyant l'énergie aller vers le défaut) déclenche." },

            { theme: "Fonctionnement du Disjoncteur (Timing)", type: "Simulation Pratique", question: "Pendant le test de chronométrage (Timing Test / Analyzer) d'un disjoncteur, que vérifie l'ingénieur à l'aide des graphiques temporels ?", options: ["Le temps d'ouverture (ex: ~35ms), le temps de fermeture, la simultanéité des 3 pôles (discordance < 3ms), et le phénomène de rebond (Contact Bounce).", "Le temps de démarrage du groupe électrogène.", "Le temps de chargement du PC Omicron.", "L'heure locale du GPS."], correctIndex: 0, justification: "Un disjoncteur lent compromet la stabilité du réseau. Un pôle en retard crée des asymétries. Des rebonds de contact excessifs créent des arcs d'usure destructeurs." },

        window.switchMode = function(mode) { appState.mode = mode; window.renderIntro(); }

        function startTimer() {
            appState.timeRemaining = 3600; // 60 mins
            clearInterval(appState.timerInterval);
            document.getElementById('global-timer').classList.remove('hidden');
            document.getElementById('global-timer').classList.remove('bg-red-700', 'animate-pulse');
            document.getElementById('global-timer').classList.add('bg-red-600');
            updateTimerDisplay();
            
            appState.timerInterval = setInterval(() => {
                appState.timeRemaining--;
                updateTimerDisplay();
                if (appState.timeRemaining <= 0) {
                    clearInterval(appState.timerInterval);
                    autoSubmitTest();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timer-display');
            if(!el) return;
            const h = Math.floor(appState.timeRemaining / 3600);
            const m = Math.floor((appState.timeRemaining % 3600) / 60);
            const s = appState.timeRemaining % 60;
            el.innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            
            const timerContainer = document.getElementById('global-timer');
            if (appState.timeRemaining < 300) {
                timerContainer.classList.remove('bg-red-600');
                timerContainer.classList.add('bg-red-700', 'animate-pulse');
            }
        }

        function autoSubmitTest() {
            while (appState.currentQuestion < appState.testQuestions.length) {
                appState.answers.push({ questionIndex: appState.currentQuestion, selected: -1, isCorrect: false });
                appState.currentQuestion++;
            }
            window.saveResultAndRender();
        }

        window.startExam = function() {
            if (appState.mode === 'declaratif') {
                const fields = ['nom', 'prenom', 'mat', 'soc', 'poste', 'serv', 'dist'];
                let isValid = true;
                fields.forEach(f => {
                    const val = document.getElementById(`in-${f}`).value.trim();
                    if(!val) isValid = false;
                    appState[f === 'mat' ? 'matricule' : (f==='soc' ? 'societe' : (f==='serv' ? 'service' : (f==='dist' ? 'district' : f)))] = val.toUpperCase();
                });
                if (!isValid) { document.getElementById('start-error').classList.remove('hidden'); return; }
                appState.id = `${appState.matricule}-${Math.floor(100+Math.random()*900)}`;
            } else {
                const serviceVal = document.getElementById('in-serv-anon').value;
                if (!serviceVal) { document.getElementById('start-error').classList.remove('hidden'); return; }
                appState.id = document.getElementById('in-id').innerText;
                appState.nom = "ANONYME"; appState.prenom = ""; appState.matricule = "N/A";
                appState.societe = "N/A"; appState.poste = "N/A"; appState.district = "N/A";
                appState.service = serviceVal;
            }

            // --- SÉLECTION DE LA BASE DE DONNÉES EN FONCTION DU SERVICE ---
            let basePool = [];
            if (appState.service === 'Contrôle électrique') {
                basePool = JSON.parse(JSON.stringify(poolControle));
            } else if (appState.service === 'Maintenance Poste') {
                basePool = JSON.parse(JSON.stringify(poolMaintenance));
            } else if (appState.service === 'Maintenance Ligne (ML)') {
                basePool = JSON.parse(JSON.stringify(poolMaintenanceLigne));
            } else if (appState.service === 'CE ESSAIS/ANALYSES') {
                basePool = JSON.parse(JSON.stringify(poolEssaisAnalyses));
            } else {
                basePool = JSON.parse(JSON.stringify(poolExploitation)); 
            }

            const nbReq = document.getElementById('in-num-q').value;
            basePool = shuffleArray(basePool);
            
            if (nbReq !== 'all') {
                const limite = parseInt(nbReq);
                appState.testQuestions = basePool.slice(0, Math.min(limite, basePool.length));
            } else {
                appState.testQuestions = basePool;
            }
            
            appState.currentQuestion = 0; appState.answers = []; appState.score = 0;
            startTimer();
            window.renderQuestion();
        }

        window.submitAnswer = function() {
            const selectedOpt = document.querySelector('input[name="q-option"]:checked');
            if (!selectedOpt) return;
            const selectedIndex = parseInt(selectedOpt.value);
            const isCorrect = selectedIndex === appState.testQuestions[appState.currentQuestion].correctIndex;
            
            appState.answers.push({ questionIndex: appState.currentQuestion, selected: selectedIndex, isCorrect: isCorrect });
            if (isCorrect) appState.score++;
            
            appState.currentQuestion++;
            if (appState.currentQuestion < appState.testQuestions.length) window.renderQuestion();
            else window.saveResultAndRender();
        }

        window.saveResultAndRender = function() {
            clearInterval(appState.timerInterval);
            document.getElementById('global-timer').classList.add('hidden');
            
            const percentage = Math.round((appState.score / appState.testQuestions.length) * 100);
            const timeUsed = 3600 - appState.timeRemaining;
            
            const resultData = {
                id: appState.id, mode: appState.mode,
                nom: appState.nom, prenom: appState.prenom, matricule: appState.matricule, 
                societe: appState.societe, poste: appState.poste, service: appState.service, district: appState.district,
                score: appState.score, total: appState.testQuestions.length, percentage: percentage, 
                date: new Date().toLocaleString('fr-FR'), timeUsed: timeUsed,
                answers: JSON.parse(JSON.stringify(appState.answers)),
                testSnapshot: JSON.parse(JSON.stringify(appState.testQuestions))
            };
            
            window.allCandidatesResults.unshift(resultData);
            saveToLocalStorage(); 
            
            renderFinalScore(resultData);

        window.exportToCSV = function() {
            if (window.allCandidatesResults.length === 0) return alert("Aucune donnée à exporter.");
            
            let csvContent = "\uFEFF"; 
            csvContent += "Date;Identifiant;Mode;Nom;Prénom;Matricule;Société;Poste;Service;District;Score;Total Questions;Pourcentage;Temps (secondes)\n";
            window.allCandidatesResults.forEach(res => {
                let row = [
                    res.date, res.id, res.mode, res.nom, res.prenom, res.matricule,
                    res.societe, res.poste, res.service, res.district,
                    res.score, res.total, res.percentage + "%", res.timeUsed
                ];
                csvContent += row.map(e => `"${(e || '').toString().replace(/"/g, '""')}"`).join(";") + "\n";
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a"); link.setAttribute("href", url); link.setAttribute("download", `Resultats_Habilitation_Sonelgaz_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

                                    <h3 class="text-2xl font-bold">${cand.nom} ${cand.prenom}</h3>
                                    <p class="text-sm font-bold text-sonelgaz-blue uppercase mt-1"><i class="fas fa-network-wired"></i> ${cand.service}</p>
                                    <p class="text-xs text-slate-500">${cand.poste} | ${cand.societe}</p>
                                </div>
                                <div class="text-right"><div class="text-3xl font-black ${cand.percentage >= 80 ? 'text-green-600' : 'text-red-600'}">${cand.percentage}%</div><div class="text-xs text-slate-400">${cand.score}/${cand.total}</div></div>
                            </div>
                            <div class="grid grid-cols-3 gap-2 text-xs text-slate-600 bg-slate-50 p-3 rounded-lg border">
                                <div><strong>Matricule:</strong><br>${cand.matricule}</div>
                                <div><strong>District:</strong><br>${cand.district}</div>
                                <div><strong>Temps d'éval:</strong><br>${timeStr}</div>
                            </div>
                        </div>

                        <div>
                            <h3 class="text-lg font-bold mb-3"><i class="fas fa-list-check text-sonelgaz-blue mr-2"></i> Détail de toutes les réponses</h3>
                            <div class="space-y-2">${detailsHtml}</div>
                        </div>

                    </div>
                </div>
            `;
        }

        window.renderAIAnalysisPage = function(idx) {
            const cand = window.allCandidatesResults[idx];
            
            appContainer.innerHTML = `
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl overflow-hidden fade-in border border-slate-200 min-h-[70vh] flex flex-col items-center justify-center p-10">
                    <div class="text-sonelgaz-blue text-6xl mb-6"><i class="fas fa-brain animate-pulse"></i></div>
                    <h2 class="text-2xl font-bold text-slate-800 mb-2">Génération de l'expertise IA en cours...</h2>
                    <p class="text-slate-500 mb-8 text-center max-w-lg">L'Intelligence Artificielle analyse les erreurs de ${cand.nom} spécifiques à sa spécialité (${cand.service}) pour rédiger un rapport détaillé.</p>
                    <div class="w-64 bg-slate-200 rounded-full h-2 overflow-hidden relative">
                        <div class="bg-sonelgaz-orange h-2 absolute w-1/2 rounded-full animate-[progress_1.5s_ease-in-out_infinite]"></div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                let erreursHtml = ''; let risquesArray = []; let nbErrors = 0;
                cand.answers.forEach(a => {
                    if (!a.isCorrect) {
                        nbErrors++;
                        const q = cand.testSnapshot[a.questionIndex];
                        erreursHtml += `<li><strong>Faiblesse en [${q.theme}] :</strong> Le candidat a choisi "${q.options[a.selected] || 'Non répondu'}" au lieu de la procédure stricte ("${q.options[q.correctIndex]}").</li>`;
                        
                        // Mapping d'erreurs pour l'IA
                        if(q.theme.includes("SF6") || q.theme.includes("Transformateur") || q.theme.includes("OLTC")) risquesArray.push("Risque de destruction matérielle majeure (Explosion de l'équipement, Incendie des huiles).");
                        if(q.theme.includes("Consignation") || q.theme.includes("Mise à la Terre") || q.theme.includes("Tension de Pas") || q.theme.includes("Terre")) risquesArray.push("Risque mortel d'électrocution pour le personnel au sol (Tension de pas ou réalimentation).");
                        if(q.theme.includes("Protection") || q.theme.includes("Relais") || q.theme.includes("Batteries") || q.theme.includes("Injection") || q.theme.includes("Omicron")) risquesArray.push("Risque de perte totale de contrôle (Black-out, paralysie des sécurités, non-déclenchement dû à des erreurs de filerie ou paramétrage non décelées).");
                        if(q.theme.includes("Hauteur") || q.theme.includes("EPI") || q.theme.includes("Harnais") || q.theme.includes("Point Mort")) risquesArray.push("Risque mortel de chute de grande hauteur lié au non-respect de l'ancrage 100%.");
                        if(q.theme.includes("Lavage") || q.theme.includes("Isolateurs") || q.theme.includes("Téléphone")) risquesArray.push("Risque mortel d'électrocution directe ou d'amorçage d'arc dû à l'inattention ou au non-respect des distances de garde.");
                        if(q.theme.includes("Câbles") || q.theme.includes("VLF") || q.theme.includes("TDR") || q.theme.includes("Thumper") || q.theme.includes("Burn-down") || q.theme.includes("Localisation")) risquesArray.push("Risque de destruction d'un câble sain par une méthode d'essai inappropriée (DC Hipot) ou mauvaise localisation coûtant de lourds travaux de génie civil.");
                    }
                });

                let htmlContent = '';
                if (nbErrors === 0) {
                    htmlContent = `<p><strong>Le candidat ${cand.nom} ${cand.prenom} a obtenu un score parfait de 100% sur le module ${cand.service}.</strong></p><p>Aucune faille technique ni méconnaissance n'a été détectée. Le candidat maîtrise parfaitement les procédures de son domaine.</p>`;
                } else {
                    let risquesUniques = [...new Set(risquesArray)];
                    let risquesHtml = risquesUniques.map(r => `<li>${r}</li>`).join('');
                    let recoHtml = cand.percentage < 80 
                        ? `<li><strong>Formation immédiate :</strong> Un recyclage technique intensif ciblé sur son module (${cand.service}) est indispensable avant toute intervention complexe.</li>`
                        : `<li><strong>Recommandation :</strong> Rappel verbal des points techniques spécifiques lors du prochain briefing équipe.</li>`;

                    htmlContent = `
                        <h3>1. Résumé de l'Évaluation (${cand.service})</h3>
                        <p>Le candidat <strong>${cand.nom} ${cand.prenom}</strong> (${cand.poste}) a obtenu un score de <strong>${cand.percentage}%</strong>. L'analyse révèle des lacunes sur ${nbErrors} point(s) critique(s).</p>
                        <h3>2. Analyse des Lacunes Techniques et Comportementales</h3>
                        <ul>${erreursHtml}</ul>
                        <h3>3. Risques Potentiels sur le Terrain</h3>
                        <ul>${risquesHtml || "<li>Risque d'exploitation mineur (Erreurs analytiques ou administratives).</li>"}</ul>
                        <h3>4. Plan d'Action et Recommandations (HSE/STOS)</h3>
                        <ul>${recoHtml}</ul>
                    `;
                }

                appContainer.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl overflow-hidden fade-in border border-slate-200 flex flex-col h-[85vh]">
                        <div class="bg-slate-900 p-6 flex justify-between items-center text-white border-b-4 border-sonelgaz-blue shrink-0">
                            <div class="flex items-center gap-3">
                                <i class="fas fa-robot text-sonelgaz-blue text-3xl"></i>
                                <div><h2 class="text-xl font-bold">Rapport d'Expertise IA</h2><p class="text-sm text-slate-400">Généré pour ${cand.nom} ${cand.prenom} | Module : ${cand.service}</p></div>
                            </div>
                            <div class="flex gap-3">
                                <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-sm font-bold transition"><i class="fas fa-print mr-2"></i> Imprimer</button>
                                <button onclick="window.viewCandidateDetails(${idx})" class="bg-sonelgaz-orange hover:bg-orange-600 px-4 py-2 rounded-xl text-sm font-bold transition"><i class="fas fa-arrow-left mr-2"></i> Retour</button>
                            </div>
                        </div>
                        <div class="p-8 md:p-12 overflow-y-auto custom-scrollbar flex-grow bg-slate-50">
                            <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 ai-report text-slate-800">
                                ${htmlContent}
                            </div>
                        </div>
                    </div>
                `;
            }, 1500); 
        }

        renderIntro();
    </script>
</body>
</html>
